kind = "web"
previewPath = "/"
title = "AutoOrder Dashboard"
description = "Middleware automation dashboard that intercepts Telegram orders from a main sales bot, automatically calls a supplier bot API (Canboso) to fulfill them, and delivers the product to the customer via Telegram. Includes order monitoring, product mapping, market automation, and system configuration."
version = "1.0.0"
id = "artifacts/dashboard"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 23183

[services.development]
run = "pnpm --filter @workspace/dashboard run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/dashboard", "run", "build" ]
serve = "static"
publicDir = "artifacts/dashboard/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "23183"
BASE_PATH = "/"
